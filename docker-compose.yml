services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      - ZOOM_BACKEND=bridge
      - SCHEDULE_FILE=/app/schedule.json
      - SCHEDULE_TZ=Asia/Kolkata
    restart: on-failure
    volumes:
      - ./knowledge:/app/knowledge
      - ./vector_store:/app/vector_store
      - ./src:/app/src
      - ${SCHEDULE_PATH:-./schedule.json}:/app/schedule.json:ro
